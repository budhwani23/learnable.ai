# Push to dev → test → build the single Docker image → deploy to Amazon Lightsail (eu-west-1).
#
# AWS access uses GitHub OIDC (no AWS keys stored here): the role in vars.AWS_ROLE_ARN
# trusts only pushes to refs/heads/dev of this repository.
#
# Repository variables: AWS_ROLE_ARN, LIGHTSAIL_SERVICE, (optional) VITE_GOOGLE_CLIENT_ID
# Repository secrets:   DJANGO_SECRET_KEY, DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD,
#                       GOOGLE_API_KEY, (optional) GOOGLE_OAUTH_CLIENT_ID
# scripts/setup-github-deploy.sh sets them from backend/.env.
name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learnable
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-not-secret
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: learnable
      DB_USER: postgres
      DB_PASSWORD: postgres
      GOOGLE_API_KEY: ci-placeholder   # services are constructed at import; tests don't call Gemini
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py check
          python manage.py makemigrations --check --dry-run users library lti learning content
          python manage.py test --noinput

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend typecheck and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit -p tsconfig.app.json
          npm run build
      - name: Frontend lint (report only; existing lint debt)
        working-directory: frontend
        continue-on-error: true
        run: npx eslint src

  deploy:
    name: Build and deploy to Lightsail
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write   # for the OIDC token exchanged for the AWS role
    env:
      SERVICE: ${{ vars.LIGHTSAIL_SERVICE }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install lightsailctl
        run: |
          sudo curl -fsSL "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" -o /usr/local/bin/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl

      - name: Build image (linux/amd64)
        run: |
          docker build --platform linux/amd64 \
            --build-arg VITE_GOOGLE_CLIENT_ID="${{ vars.VITE_GOOGLE_CLIENT_ID }}" \
            -t learnable:${{ github.sha }} .

      - name: Push image to the Lightsail registry
        id: push
        run: |
          out=$(aws lightsail push-container-image --service-name "$SERVICE" --label app \
                  --image "learnable:${{ github.sha }}" --region "$AWS_REGION")
          echo "$out"
          ref=$(echo "$out" | grep -o '":[^"]*"' | tail -1 | tr -d '"')
          test -n "$ref" || { echo "Could not read the pushed image reference"; exit 1; }
          echo "image=$ref" >> "$GITHUB_OUTPUT"

      - name: Create deployment
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          url=$(aws lightsail get-container-services --service-name "$SERVICE" --region "$AWS_REGION" \
                  --query 'containerServices[0].url' --output text)
          host=$(echo "$url" | sed -E 's#^https?://##; s#/.*$##')
          origin="https://$host"
          containers=$(jq -n \
            --arg image "$IMAGE" --arg host "$host" --arg origin "$origin" --arg sha "${{ github.sha }}" \
            --arg secret "$DJANGO_SECRET_KEY" --arg dbhost "$DB_HOST" --arg dbport "$DB_PORT" \
            --arg dbname "$DB_NAME" --arg dbuser "$DB_USER" --arg dbpass "$DB_PASSWORD" \
            --arg gkey "$GOOGLE_API_KEY" --arg gclient "$GOOGLE_OAUTH_CLIENT_ID" '{
              app: {
                image: $image,
                ports: {"8000": "HTTP"},
                environment: {
                  DJANGO_DEBUG: "false",
                  DJANGO_SECRET_KEY: $secret,
                  DJANGO_ALLOWED_HOSTS: ($host + ",localhost,127.0.0.1"),
                  CSRF_TRUSTED_ORIGINS: $origin,
                  FRONTEND_URL: $origin,
                  DB_HOST: $dbhost, DB_PORT: $dbport, DB_NAME: $dbname,
                  DB_USER: $dbuser, DB_PASSWORD: $dbpass, DB_SSLMODE: "require",
                  GOOGLE_API_KEY: $gkey,
                  GOOGLE_OAUTH_CLIENT_ID: $gclient,
                  GIT_SHA: $sha
                }
              }
            }')
          endpoint='{"containerName":"app","containerPort":8000,"healthCheck":{"path":"/healthz","intervalSeconds":15,"timeoutSeconds":5,"healthyThreshold":2,"unhealthyThreshold":4,"successCodes":"200"}}'
          aws lightsail create-container-service-deployment --service-name "$SERVICE" --region "$AWS_REGION" \
            --containers "$containers" --public-endpoint "$endpoint" \
            --query 'containerService.nextDeployment.version' --output text > version.txt
          echo "Deployment version $(cat version.txt) created for $IMAGE"

      - name: Wait for the deployment to become active
        run: |
          version=$(cat version.txt)
          for i in $(seq 1 60); do
            state=$(aws lightsail get-container-service-deployments --service-name "$SERVICE" --region "$AWS_REGION" \
                      --query "deployments[?version==\`$version\`].state | [0]" --output text)
            echo "[$i] deployment $version: $state"
            case "$state" in
              ACTIVE) exit 0 ;;
              FAILED)
                aws lightsail get-container-log --service-name "$SERVICE" --container-name app \
                  --region "$AWS_REGION" --query 'logEvents[-60:].message' --output text || true
                exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for deployment $version"; exit 1

      - name: Smoke test
        run: |
          url=$(aws lightsail get-container-services --service-name "$SERVICE" --region "$AWS_REGION" \
                  --query 'containerServices[0].url' --output text)
          curl -fsS --retry 5 --retry-delay 5 "${url%/}/healthz"
          curl -fsS -o /dev/null "${url%/}/"
          echo "Live at $url"
          echo "### Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
