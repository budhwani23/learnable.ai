# Push to dev → test → build the single Docker image → push to ECR → deploy to the
# EC2 host behind CloudFront (eu-west-1) through SSM Run Command (deploy/ec2-deploy.sh).
#
# AWS access uses GitHub OIDC (no AWS keys stored here): the role in vars.AWS_ROLE_ARN
# trusts this repository's 'dev' environment (OIDC sub repo:<repo>:environment:dev),
# and that environment only accepts deployments from the dev branch.
#
# Repository variables: AWS_ROLE_ARN, ECR_REPOSITORY_URI, EC2_INSTANCE_ID, APP_URL,
#                       (optional) VITE_GOOGLE_CLIENT_ID
# Environment 'dev' secrets: DJANGO_SECRET_KEY, DB_HOST, DB_PORT, DB_NAME, DB_USER,
#                       DB_PASSWORD, GOOGLE_API_KEY, (optional) GOOGLE_OAUTH_CLIENT_ID
# scripts/setup-github-deploy.sh sets them (secrets from backend/.env).
name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learnable
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-not-secret
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: learnable
      DB_USER: postgres
      DB_PASSWORD: postgres
      GOOGLE_API_KEY: ci-placeholder   # services are constructed at import; tests don't call Gemini
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py check
          python manage.py makemigrations --check --dry-run users library lti learning content adminpanel
          python manage.py test --noinput

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend typecheck and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit -p tsconfig.app.json
          npm run build
      - name: Frontend lint (report only; existing lint debt)
        working-directory: frontend
        continue-on-error: true
        run: npx eslint src

  deploy:
    name: Build and deploy to EC2
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write   # for the OIDC token exchanged for the AWS role
    env:
      IMAGE: ${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        run: >-
          aws ecr get-login-password --region "$AWS_REGION"
          | docker login --username AWS --password-stdin "${IMAGE%%/*}"

      - name: Build and push image (linux/amd64)
        run: |
          docker build --platform linux/amd64 --build-arg VITE_GOOGLE_CLIENT_ID="${{ vars.VITE_GOOGLE_CLIENT_ID }}" -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Store app settings in SSM Parameter Store (encrypted)
        env:
          APP_URL: ${{ vars.APP_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          PRESENTON_IMAGE_PROXY_KEY: ${{ secrets.PRESENTON_IMAGE_PROXY_KEY }}
        run: |
          host="${APP_URL#https://}"; host="${host%%/*}"
          env_file=$(mktemp)
          {
            echo "DJANGO_DEBUG=false"
            echo "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY"
            # "learnable" is the app's name on the host's Docker network (Presenton calls it).
            echo "DJANGO_ALLOWED_HOSTS=$host,learnable,localhost,127.0.0.1"
            echo "CSRF_TRUSTED_ORIGINS=$APP_URL"
            echo "FRONTEND_URL=$APP_URL"
            echo "SECURE_PROXY_SSL_HEADER_NAME=HTTP_CLOUDFRONT_FORWARDED_PROTO"
            echo "DB_HOST=$DB_HOST"
            echo "DB_PORT=$DB_PORT"
            echo "DB_NAME=$DB_NAME"
            echo "DB_USER=$DB_USER"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "DB_SSLMODE=require"
            echo "GOOGLE_API_KEY=$GOOGLE_API_KEY"
            echo "GOOGLE_OAUTH_CLIENT_ID=$GOOGLE_OAUTH_CLIENT_ID"
            echo "NVIDIA_API_KEY=$NVIDIA_API_KEY"
            # Text generation (learning tools, explainer scripts, slide text) on Cerebras.
            echo "CEREBRAS_API_KEY=$CEREBRAS_API_KEY"
            echo "CEREBRAS_MODEL=qwen-3.8-27b"
            echo "PRESENTON_IMAGE_PROXY_KEY=$PRESENTON_IMAGE_PROXY_KEY"
            echo "GIT_SHA=$GITHUB_SHA"
          } > "$env_file"
          aws ssm put-parameter --region "$AWS_REGION" --name /learnable/dev/env --type SecureString --overwrite --value "file://$env_file" > /dev/null
          rm -f "$env_file"
          echo "Settings stored."

      - name: Deploy on the EC2 host (SSM Run Command)
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          remote=$(mktemp)
          { echo "export IMAGE='$IMAGE' AWS_REGION='$AWS_REGION'"; cat deploy/ec2-deploy.sh; } > "$remote"
          params=$(jq -n --rawfile s "$remote" '{commands: [$s], executionTimeout: ["900"]}')
          cmd_id=$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "deploy $GITHUB_SHA" --parameters "$params" --query Command.CommandId --output text)
          echo "SSM command $cmd_id"
          status=Pending
          for i in $(seq 1 80); do
            sleep 10
            status=$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$cmd_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            echo "[$i] $status"
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$cmd_id" --instance-id "$INSTANCE_ID" --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          test "$status" = "Success"

      - name: Smoke test through CloudFront
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "$APP_URL/healthz"
          curl -fsS -o /dev/null "$APP_URL/"
          echo "Live at $APP_URL"
          echo "### Deployed $GITHUB_SHA to $APP_URL" >> "$GITHUB_STEP_SUMMARY"
